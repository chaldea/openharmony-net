name: Build and test
on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'dotnet/**'
      - 'build.ps1'
      - 'global.json'
      - 'OpenHarmony.slnx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Keep exact bootstrap SDK selection independent of runner-preinstalled SDKs.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/build-sdk
      # Runtime sources exceed MAX_PATH. Apply to Git and its child processes
      # before checkout, including the later runtime submodule initialization.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.value }}
      sdk-version: ${{ steps.version.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve workload version
        id: version
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.OpenHarmonyPackageVersion.InnerText
          "value=$version" >> $env:GITHUB_OUTPUT
          "sdk=$((Get-Content -Raw global.json | ConvertFrom-Json).sdk.version)" >> $env:GITHUB_OUTPUT
          "WORKLOAD_VERSION=$version" >> $env:GITHUB_ENV
          "build-runtime=$((Get-Content -Raw tools/ci-runtime-packages.json | ConvertFrom-Json).buildFromSource -eq $true)" >> $env:GITHUB_OUTPUT
      - name: Check runtime sources and the stable build SDK
        id: runtime
        if: steps.version.outputs.build-runtime == 'True'
        run: |
          git submodule update --init dotnet/runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime checkout failed.' }
          ./tools/resolve-runtime-sdk.ps1
          "commit=$((git -C dotnet/runtime rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT
      - name: Build and test the unified solution
        run: ./build.ps1 -Target Test -Version $env:WORKLOAD_VERSION
      - name: Package managed and build tools
        run: ./build.ps1 -Target PackTools -Version $env:WORKLOAD_VERSION
      - name: Restore cached NativeAOT runtime baseline
        id: runtime-cache
        if: steps.version.outputs.build-runtime == 'True'
        uses: actions/cache@v4
        with:
          path: |
            artifacts/native/runtime/api13/x64/Release/bin/coreclr/openharmony.x64.Release
            artifacts/native/runtime/api13/x64/Release/bin/microsoft.netcore.app.runtime.linux-musl-x64
            artifacts/native/runtime/api13/x64/Release/runtime-build-provenance.json
            artifacts/native/runtime/api13/arm64/Release/bin/coreclr/openharmony.arm64.Release
            artifacts/native/runtime/api13/arm64/Release/bin/microsoft.netcore.app.runtime.linux-musl-arm64
            artifacts/native/runtime/api13/arm64/Release/runtime-build-provenance.json
          key: runtime-${{ runner.os }}-${{ steps.runtime.outputs.commit }}-${{ hashFiles('global.json', 'tools/build-runtime.ps1', 'tools/prepare-native-dependencies.ps1', 'tools/ci-runtime-packages.json', 'dotnet/runtime/eng/openharmony/sdk-catalog.json', 'dotnet/runtime/eng/openharmony/dependencies.json') }}
      - name: Prepare native SDKs and dependencies
        if: steps.version.outputs.build-runtime == 'True' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          ./tools/install-native-sdk.ps1
          ./tools/prepare-native-dependencies.ps1 -SdkRoot ./artifacts/native/sdk
      - name: Build and package the unpublished runtime baseline from source
        if: steps.version.outputs.build-runtime == 'True' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          ./tools/build-runtime.ps1 -SdkRoot ./artifacts/native/sdk
          ./build.ps1 -Target PackRuntime -Version $env:WORKLOAD_VERSION
      - name: Package the runtime baseline from the cached build
        if: steps.version.outputs.build-runtime == 'True' && steps.runtime-cache.outputs.cache-hit == 'true'
        run: ./build.ps1 -Target PackRuntime -Version $env:WORKLOAD_VERSION
      - name: Complete the workload feed with pinned native runtime packages
        run: ./tools/prepare-ci-packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: workload-packages
          path: artifacts/ci-packages/*.nupkg
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Isolate file-based workload installation from preinstalled SDKs and MSI.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-sdk
      WORKLOAD_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workload-packages
          path: artifacts/ci-packages
      - uses: actions/setup-dotnet@v4
        with:
          # Install exactly the feature band embedded in the workload manifest.
          dotnet-version: ${{ needs.build.outputs.sdk-version }}
      - name: Verify the standalone SDK version
        run: |
          $expected = (Get-Content -Raw global.json | ConvertFrom-Json).sdk.version
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) { throw "Expected SDK $expected, selected $actual." }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux SDK dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true
      - name: Check the HarmonyOS toolchain
        run: |
          $cli = Split-Path $env:HOS_SDK_HOME -Parent
          $native = Join-Path $cli 'sdk/default/openharmony/native'
          if (!(Test-Path (Join-Path $native 'oh-uni-package.json'))) { throw 'HarmonyOS Native SDK is missing.' }
          "OHOS_COMMAND_LINE_TOOLS=$cli" >> $env:GITHUB_ENV
          hvigorw -v
          if ($LASTEXITCODE -ne 0) { throw 'Hvigor is unavailable.' }
      - name: Install workload, create an app and publish both HAP architectures
        run: |
          ./tools/verify-workload.ps1 -DotnetRoot $env:DOTNET_INSTALL_DIR `
            -CommandLineTools $env:OHOS_COMMAND_LINE_TOOLS -JavaHome $env:JAVA_HOME `
            -PackageSource ./artifacts/ci-packages -Version $env:WORKLOAD_VERSION
