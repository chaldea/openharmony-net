name: Build and test
on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'dotnet/**'
      - 'build.ps1'
      - 'global.json'
      - 'OpenHarmony.slnx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Keep exact bootstrap SDK selection independent of runner-preinstalled SDKs.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/build-sdk
      # Runtime sources exceed MAX_PATH. Apply to Git and its child processes
      # before checkout, including the later runtime submodule initialization.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.value }}
      sdk-version: ${{ steps.version.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve workload version
        id: version
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.OpenHarmonyPackageVersion.InnerText
          "value=$version" >> $env:GITHUB_OUTPUT
          "sdk=$((Get-Content -Raw global.json | ConvertFrom-Json).sdk.version)" >> $env:GITHUB_OUTPUT
          "WORKLOAD_VERSION=$version" >> $env:GITHUB_ENV
          "build-runtime=$((Get-Content -Raw tools/ci-runtime-packages.json | ConvertFrom-Json).buildFromSource -eq $true)" >> $env:GITHUB_OUTPUT
      - name: Download the pinned NativeAOT runtime baseline
        if: steps.version.outputs.build-runtime == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BASELINE_REPOSITORY: ${{ vars.RUNTIME_BASELINE_REPOSITORY || github.repository }}
        run: ./tools/runtime-baseline.ps1 -Action Restore -Repository $env:RUNTIME_BASELINE_REPOSITORY
      - name: Check out the runtime SDK catalog
        run: |
          git submodule update --init --depth 1 dotnet/runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime checkout failed.' }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test the unified solution
        run: ./build.ps1 -Target Test -Version $env:WORKLOAD_VERSION
      - name: Package managed and build tools
        run: |
          ./tools/install-native-sdk.ps1 -ApiLevels 15
          ./build.ps1 -Target PackTools -Version $env:WORKLOAD_VERSION -FrameworkNativeSdk ./artifacts/native/sdk/15/native
      - name: Package the NativeAOT runtime baseline for this workload version
        if: steps.version.outputs.build-runtime == 'True'
        run: ./build.ps1 -Target PackRuntime -Version $env:WORKLOAD_VERSION -RuntimeArtifacts ./artifacts/runtime-baseline
      - name: Complete the workload feed with pinned native runtime packages
        run: ./tools/prepare-ci-packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: workload-packages
          path: artifacts/ci-packages/*.nupkg
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: bash
    env:
      # Isolate file-based workload installation from preinstalled SDKs and MSI.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-sdk
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/ci-nuget
      WORKLOAD_VERSION: ${{ needs.build.outputs.version }}
      SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
      HARMONYOS_CLI_VERSION: '6.1.1.280'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workload-packages
          path: artifacts/ci-packages
      - uses: actions/setup-dotnet@v4
        with:
          # Install exactly the feature band embedded in the workload manifest.
          dotnet-version: ${{ needs.build.outputs.sdk-version }}
      - name: Verify the standalone SDK version
        run: |
          actual=$(dotnet --version)
          test "$actual" = "$SDK_VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux SDK dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
      - name: Restore the shared Windows HarmonyOS CLI
        if: runner.os == 'Windows'
        id: windows-ohos-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/ohos-sdk/command-line-tools
          key: windows-ohos-cli-${{ runner.arch }}-${{ env.HARMONYOS_CLI_VERSION }}
      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.HARMONYOS_CLI_VERSION }}
          # setup-ohos caches the whole download directory, including its multi-GB source archive.
          cache: false
      - name: Check the HarmonyOS toolchain
        run: |
          sdk="$HOS_SDK_HOME"
          hvigor=hvigorw
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sdk=$(cygpath -am "$sdk")
            hvigor=hvigorw.bat
          fi
          cli=$(dirname "$sdk")
          test -f "$sdk/default/openharmony/native/oh-uni-package.json"
          "$cli/bin/$hvigor" -v
          echo "$cli/bin" >> "$GITHUB_PATH"
      - name: Seed the default branch Windows HarmonyOS CLI cache
        if: >-
          runner.os == 'Windows' && steps.windows-ohos-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch &&
          github.ref_type == 'branch'
        uses: actions/cache/save@v4
        with:
          path: ~/ohos-sdk/command-line-tools
          key: ${{ steps.windows-ohos-cache.outputs.cache-primary-key }}
      - name: Install workload, create an app and publish both HAP architectures
        working-directory: artifacts
        run: |
          cat > NuGet.Config <<'EOF'
          <configuration>
            <packageSources>
              <clear />
              <add key="ci" value="ci-packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="ci"><package pattern="Chaldea.*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          unset DOTNET_ROOT OHOS_COMMAND_LINE_TOOLS
          dotnet tool install Chaldea.OpenHarmony.Workload --tool-path ./workload-tool --version "$WORKLOAD_VERSION" --configfile NuGet.Config
          tool="./workload-tool/ohos"
          if [[ "$RUNNER_OS" == "Windows" ]]; then tool="$tool.cmd"; fi
          "$tool" workload install --source ./ci-packages
          "$tool" workload list
          dotnet new ohos -n WorkloadSmoke -o workload-app
          dotnet publish workload-app/WorkloadSmoke.csproj -c Release -warnaserror:NU1603
          dotnet publish workload-app/WorkloadSmoke.csproj -c Release -warnaserror:NU1603 -p:OpenHarmonyAbi=arm64-v8a
          "$tool" workload uninstall
